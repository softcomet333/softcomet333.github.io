name: Archive website to Wayback Machine

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Save website to Wayback Machine
        uses: JamieMagee/wayback@v1.3.28
        with:
          url: https://softcomet333.github.io/
          saveErrors: true
          saveOutlinks: true
          saveScreenshot: true
