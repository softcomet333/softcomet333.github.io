<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

            <span class="site-status">PERSONAL ARCHIVE / ONLINE</span>

        <hr>

        <article>
            {{ content }}
        </article>

        <footer>
            <hr>
            <p>softcomet333 · EST. UNKNOWN</p>
        </footer>
    </main>
</body>

</html>
