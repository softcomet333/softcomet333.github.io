<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% raw %}{{ page.title | default: site.title | escape }}{% endraw %}</title>

    <meta name="description" content="{% raw %}{{ page.description | default: site.description | escape }}{% endraw %}">

    <link rel="stylesheet" href="{% raw %}{{ '/assets/css/style.css' | relative_url }}{% endraw %}">
</head>

<body>
    <main class="container">
        <header class="site-header">
            <a class="site-title" href="{% raw %}{{ '/' | relative_url }}{% endraw %}">
                {% raw %}{{ site.title }}{% endraw %}
            </a>
            <span class="site-status">PERSONAL ARCHIVE / ONLINE</span>
        </header>

        <hr>

        <article>
            {% raw %}{{ content }}{% endraw %}
        </article>

        <footer>
            <hr>
            <p>softcomet333 · EST. UNKNOWN</p>
        </footer>
    </main>
</body>

</html>
